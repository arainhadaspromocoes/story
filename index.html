<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Story Duplo 👑🤴 | Achadinhos em Dupla</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<style>
  :root{
    --azul:#3A4BD8;
    --tinta:#15151F;
    --papel:#F2F1EA;
    --amarelo:#F5C518;
    --lilas:#A99DF5;
    --verde:#5FD68F;
    --rosa:#F2557C;
    --rosa-claro:#FFD3DE;
    --borda:2.4px solid var(--tinta);
    --sombra-g:6px 6px 0 0 var(--tinta);
    --sombra-m:4px 4px 0 0 var(--tinta);
    --sombra-p:2px 2px 0 0 var(--tinta);
    --raio:12px;
    --raio-btn:10px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    font-family:"Space Grotesk",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    background-color:var(--azul);
    background-image:
      linear-gradient(rgba(255,255,255,.09) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.09) 1px, transparent 1px);
    background-size:30px 30px;
    color:var(--tinta);
    min-height:100vh;
  }
  a{text-decoration:none;color:inherit}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input{font-family:inherit}

  .estrela{position:fixed;font-size:26px;z-index:0;pointer-events:none;opacity:.95;text-shadow:2px 2px 0 rgba(0,0,0,.25)}
  .e1{top:9%;left:5%}.e2{top:22%;right:6%;font-size:32px}.e3{bottom:18%;left:7%}.e4{bottom:30%;right:5%;font-size:20px}

  .container{max-width:560px;margin:0 auto;padding:22px 16px 40px;position:relative;z-index:1}

  .janela{
    background:var(--papel);border:var(--borda);border-radius:var(--raio);
    box-shadow:var(--sombra-g);overflow:hidden;margin-bottom:20px;
  }
  .barra{
    display:flex;align-items:center;justify-content:space-between;
    padding:8px 12px;border-bottom:var(--borda);
    font-size:13px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;
  }
  .barra-lilas{background:var(--lilas)}
  .barra-verde{background:var(--verde)}
  .barra-amarela{background:var(--amarelo)}
  .barra-rosa{background:var(--rosa-claro)}
  .barra .controles{display:flex;gap:8px;align-items:center;font-weight:700;font-size:13px;opacity:.85}
  .janela .corpo{padding:16px}

  .hero-titulo{text-align:center;font-weight:700;color:var(--azul);font-size:28px;line-height:1.25;letter-spacing:.5px}
  .hero-sub{text-align:center;font-size:14.5px;margin-top:10px;line-height:1.5}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    border:var(--borda);border-radius:var(--raio-btn);box-shadow:var(--sombra-m);
    font-size:14px;font-weight:700;padding:11px 16px;
    transition:transform .1s, box-shadow .1s;background:var(--papel);
  }
  .btn:active{transform:translate(3px,3px);box-shadow:var(--sombra-p)}
  .btn-amarelo{background:var(--amarelo)}
  .btn-lilas{background:var(--lilas)}
  .btn-verde{background:var(--verde)}
  .btn-rosa{background:var(--rosa-claro);color:#B4133F}
  .btn-bloco{width:100%}
  .btn-mini{padding:7px 11px;font-size:12.5px;box-shadow:var(--sombra-p)}
  .btn-mini:active{transform:translate(2px,2px);box-shadow:none}

  /* Card de produto na página pública */
  .card-prod{
    background:#fff;border:var(--borda);border-radius:var(--raio);
    box-shadow:var(--sombra-m);overflow:hidden;margin-bottom:18px;
  }
  .card-prod .foto{width:100%;aspect-ratio:1/1;object-fit:contain;background:#fff;display:block;border-bottom:var(--borda)}
  .card-prod .info{padding:14px 14px 16px}
  .card-prod .nome{font-size:16.5px;font-weight:700;line-height:1.35;margin-bottom:8px}
  .card-prod .preco{font-size:26px;font-weight:700;color:var(--azul);line-height:1.1}
  .card-prod .parcelas{font-size:13.5px;font-weight:600;opacity:.75;margin-top:2px}
  .caixa-cupom{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    border:2.4px dashed var(--tinta);border-radius:10px;background:#FFFDF2;
    padding:7px 8px 7px 12px;margin-top:11px;
  }
  .codigo-cupom{font-weight:700;font-size:16px;letter-spacing:1px;word-break:break-all}

  .vazio{text-align:center;padding:36px 20px;font-size:14.5px;font-weight:500}
  .vazio .emoji{font-size:44px;margin-bottom:12px}

  .rodape{
    text-align:center;padding:10px 16px 34px;font-size:13px;color:#fff;font-weight:600;
    text-shadow:1px 1px 0 rgba(0,0,0,.3);position:relative;z-index:1;
  }
  .rodape a{text-decoration:underline;text-underline-offset:3px}
  .chip{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--papel);border:var(--borda);border-radius:var(--raio-btn);
    box-shadow:var(--sombra-p);font-size:12px;font-weight:700;padding:6px 10px;margin:0 4px 8px;
    color:var(--tinta);text-decoration:none;
  }
  .icone-insta{width:14px;height:14px;flex-shrink:0}

  /* Admin */
  .painel-secao{
    background:var(--papel);border:var(--borda);border-radius:var(--raio);
    box-shadow:var(--sombra-g);margin-bottom:20px;overflow:hidden;
  }
  .painel-secao .conteudo{padding:16px}
  .campo{margin-bottom:12px}
  .campo label{display:block;font-size:12px;margin-bottom:5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
  .campo input{
    width:100%;padding:11px 12px;font-size:14px;font-weight:500;
    border:var(--borda);border-radius:var(--raio-btn);
    outline:none;background:#fff;color:var(--tinta);transition:box-shadow .1s;
  }
  .campo input:focus{box-shadow:var(--sombra-p)}
  .campo input::placeholder{color:#999;font-weight:400}
  .duas-colunas{display:flex;gap:10px}
  .duas-colunas .campo{flex:1}
  .foto-preview{
    width:92px;height:92px;object-fit:contain;background:#fff;
    border:var(--borda);border-radius:10px;display:block;
  }
  .linha-foto{display:flex;gap:12px;align-items:center;margin-bottom:12px}
  .senha-box{max-width:420px;margin:60px auto;padding:0 16px}
  .cadeado{font-size:44px;text-align:center;margin-bottom:10px}
  .btn-icone{
    border:2px solid var(--tinta);border-radius:8px;background:#fff;
    width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;
    font-size:15px;box-shadow:var(--sombra-p);flex-shrink:0;
  }
  .btn-icone:active{transform:translate(2px,2px);box-shadow:none}
  .btn-icone.perigo{background:var(--rosa-claro);color:#B4133F}
  .linha-story{
    display:flex;align-items:center;gap:9px;
    padding:10px 0;border-bottom:2px dashed #d8d6c9;
  }
  .linha-story:last-child{border-bottom:none}
  .linha-story .mini{width:44px;height:44px;object-fit:contain;background:#fff;border:2px solid var(--tinta);border-radius:8px;flex-shrink:0}
  .linha-story .titulo{flex:1;font-size:13px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .arte-wrap{text-align:center}
  .arte-wrap canvas{
    width:100%;max-width:320px;border:var(--borda);border-radius:10px;
    box-shadow:var(--sombra-m);background:#0e1c3f;
  }
  .link-caixa{
    display:flex;align-items:center;gap:8px;
    border:2.4px dashed var(--tinta);border-radius:10px;background:#fff;
    padding:8px 10px;margin:12px 0;
  }
  .link-caixa .url{flex:1;font-size:12px;font-weight:600;word-break:break-all;text-align:left}

  .toast{
    position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(80px);
    background:var(--tinta);color:#fff;font-size:14px;font-weight:600;
    padding:11px 20px;border-radius:12px;opacity:0;transition:all .25s;z-index:99;
    pointer-events:none;white-space:nowrap;
  }
  .toast.mostra{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>

function valorRest(v){
  if (!v) return null;
  if ("stringValue" in v) return v.stringValue;
  if ("booleanValue" in v) return v.booleanValue;
  if ("integerValue" in v) return Number(v.integerValue);
  if ("doubleValue" in v) return v.doubleValue;
  if ("nullValue" in v) return null;
  if ("arrayValue" in v) return (v.arrayValue.values || []).map(valorRest);
  if ("mapValue" in v) { const o = {}, f = v.mapValue.fields || {}; for (const k in f) o[k] = valorRest(f[k]); return o; }
  return null;
}
let buscandoRest = false;
function carregarViaRest(){
  if (buscandoRest || tempoRealOk) return;
  buscandoRest = true;
  fetch("https://firestore.googleapis.com/v1/projects/" + FIREBASE_CONFIG.projectId +
        "/databases/(default)/documents/stories?pageSize=300&key=" + FIREBASE_CONFIG.apiKey)
    .then(r => r.json())
    .then(function(j){
      buscandoRest = false;
      if (tempoRealOk) return;
      stories = (j.documents || []).map(function(docu){
        const obj = {}, f = docu.fields || {};
        for (const k in f) obj[k] = valorRest(f[k]);
        obj.id = docu.name.split("/").pop();
        return obj;
      });
      stories.sort(function(a,b){ return (b.criadaEm||0) - (a.criadaEm||0); });
      guardarCache();
      rota();
    })
    .catch(function(){ buscandoRest = false; });
}

function esc(t){
  return String(t == null ? "" : t)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("mostra");
  clearTimeout(el._t);
  el._t = setTimeout(function(){ el.classList.remove("mostra"); }, 2400);
}
function copiar(texto, msg){
  const fim = function(){ toast(msg || "Copiado! ✅"); };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(texto).then(fim, function(){ copiarVelho(texto); fim(); });
  else { copiarVelho(texto); fim(); }
}
function copiarVelho(texto){
  const ta = document.createElement("textarea");
  ta.value = texto; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); } catch(e){}
  document.body.removeChild(ta);
}
function copiarEAbrir(codigo, url){

/* Comprimir foto para dataURL (produto: fundo geralmente branco → JPEG) */
function comprimirFoto(file, cb){
  const leitor = new FileReader();
  leitor.onload = function(){
    const img = new Image();
    img.onload = function(){
      const MAX = 500;
      let w = img.width, h = img.height;
      const fator = Math.min(1, MAX / Math.max(w, h));
      w = Math.round(w * fator); h = Math.round(h * fator);
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      cb(c.toDataURL("image/jpeg", 0.82));
    };
    img.src = leitor.result;
  };
  leitor.readAsDataURL(file);
}

/* ================= ARTE DO STORY (canvas com o template) ================= */
const ARTE_W = 941, ARTE_H = 1672;
/* área creme útil do template: x 68–870, y 372–1470 */

function quebrarLinhas(ctx, texto, maxLargura, maxLinhas){
  const palavras = String(texto || "").split(/\s+/).filter(Boolean);
  const linhas = [];
  let atual = "";
  for (const p of palavras){
    const teste = atual ? atual + " " + p : p;
    if (ctx.measureText(teste).width <= maxLargura) atual = teste;
    else {
      if (atual) linhas.push(atual);
      atual = p;
      if (linhas.length === maxLinhas - 1) break;
    }
  }
  if (atual && linhas.length < maxLinhas) linhas.push(atual);
  if (linhas.length === maxLinhas){
    const resto = palavras.join(" ");
    let usado = linhas.join(" ");
    if (resto.length > usado.length){
      let ult = linhas[maxLinhas-1];
      while (ctx.measureText(ult + "…").width > maxLargura && ult.length > 2) ult = ult.slice(0, -1);
      linhas[maxLinhas-1] = ult + "…";
    }
  }
  return linhas;
}

function carregarImg(src){
  return new Promise(function(res){
    if (!src) return res(null);
    const im = new Image();
    im.onload = function(){ res(im); };
    im.onerror = function(){ res(null); };
    im.src = src;
  });
}

async function desenharArte(story, canvas){
  await document.fonts.load('700 60px "Space Grotesk"');
  await document.fonts.load('600 30px "Space Grotesk"');
  canvas.width = ARTE_W; canvas.height = ARTE_H;
  const ctx = canvas.getContext("2d");
  const tpl = document.getElementById("tpl-story");
  ctx.drawImage(tpl, 0, 0, ARTE_W, ARTE_H);

  const prods = (story.produtos || []).slice(0, 2);
  const imgs = await Promise.all(prods.map(function(p){ return carregarImg(p.img); }));

  const topo = 400, base = 1444;
  const alturaTotal = base - topo;
  const alturaZona = prods.length === 1 ? alturaTotal : Math.floor((alturaTotal - 26) / 2);

  prods.forEach(function(p, i){
    const y0 = topo + i * (alturaZona + 26);
    desenharProduto(ctx, p, imgs[i], y0, alturaZona);
    if (i === 0 && prods.length === 2){
      /* divisória tracejada */
      ctx.save();
      ctx.strokeStyle = "#b9b5a5";
      ctx.lineWidth = 3;
      ctx.setLineDash([14, 12]);
      ctx.beginPath();
      ctx.moveTo(110, y0 + alturaZona + 13);
      ctx.lineTo(830, y0 + alturaZona + 13);
      ctx.stroke();
      ctx.restore();
    }
  });
}

function desenharProduto(ctx, p, img, y0, altura){
  const temFoto = !!img;
  const fotoLado = Math.min(330, altura - 40);
  const fotoX = 100, fotoY = y0 + Math.floor((altura - fotoLado) / 2);
  const txtX = temFoto ? fotoX + fotoLado + 34 : 110;
  const txtLarg = (temFoto ? 845 : 830) - txtX;

  if (temFoto){
    /* moldura da foto no estilo janelinha */
    ctx.save();
    ctx.fillStyle = "#15151F";
    rRect(ctx, fotoX + 7, fotoY + 7, fotoLado, fotoLado, 18); ctx.fill();   /* sombra dura */
    ctx.fillStyle = "#ffffff";
    rRect(ctx, fotoX, fotoY, fotoLado, fotoLado, 18); ctx.fill();
    ctx.strokeStyle = "#15151F"; ctx.lineWidth = 5;
    rRect(ctx, fotoX, fotoY, fotoLado, fotoLado, 18); ctx.stroke();
    ctx.clip();
    /* foto contida dentro do quadro */
    const m = 12;
    const esc2 = Math.min((fotoLado - m*2) / img.width, (fotoLado - m*2) / img.height);
    const w = img.width * esc2, h = img.height * esc2;
    ctx.drawImage(img, fotoX + (fotoLado - w)/2, fotoY + (fotoLado - h)/2, w, h);
    ctx.restore();
  }

  /* medir bloco de texto pra centralizar na vertical */
  ctx.textBaseline = "alphabetic";
  ctx.font = '700 36px "Space Grotesk"';
  const linhasNome = quebrarLinhas(ctx, p.nome, txtLarg, 3);
  const altNome = linhasNome.length * 44;
  const temPreco = !!String(p.preco || "").trim();
  const temParc = !!String(p.parcelas || "").trim();
  const temCupom = !!String(p.cupom || "").trim();
  let altBloco = altNome;
  if (temPreco) altBloco += 78;
  if (temParc) altBloco += 36;
  if (temCupom) altBloco += 74;
  let y = y0 + Math.max(20, Math.floor((altura - altBloco) / 2)) + 34;

  /* nome */
  ctx.fillStyle = "#15151F";
  ctx.font = '700 36px "Space Grotesk"';
  linhasNome.forEach(function(l){ ctx.fillText(l, txtX, y); y += 44; });

  /* preço */
  if (temPreco){
    y += 30;
    ctx.fillStyle = "#3A4BD8";
    ctx.font = '700 62px "Space Grotesk"';
    let ptxt = precoBonito(p.preco);
    while (ctx.measureText(ptxt).width > txtLarg && parseInt(ctx.font) > 34){
      ctx.font = '700 ' + (parseInt(ctx.font) - 4) + 'px "Space Grotesk"';
    }
    ctx.fillText(ptxt, txtX, y);
    y += 14;
  }

  /* parcelas */
  if (temParc){
    y += 26;
    ctx.fillStyle = "#4a4a55";
    ctx.font = '600 27px "Space Grotesk"';
    ctx.fillText(quebrarLinhas(ctx, p.parcelas, txtLarg, 1)[0] || "", txtX, y);
    y += 4;
  }

  /* cupom */
  if (temCupom){
    y += 22;
    const rot = "🎟️ CUPOM: ";
    ctx.font = '700 28px "Space Grotesk"';
    const texto = rot + String(p.cupom).toUpperCase();
    const larg = Math.min(txtLarg, ctx.measureText(texto).width + 40);
    const alt = 52;
    ctx.save();
    ctx.fillStyle = "#F5C518";
    rRect(ctx, txtX, y - 8, larg, alt, 12); ctx.fill();
    ctx.strokeStyle = "#15151F"; ctx.lineWidth = 4; ctx.setLineDash([10, 8]);
    rRect(ctx, txtX, y - 8, larg, alt, 12); ctx.stroke();
    ctx.restore();
    ctx.fillStyle = "#15151F";
    ctx.fillText(texto, txtX + 20, y + 27);
  }
}

function rRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function baixarArte(id){
  const s = (stories || []).find(function(x){ return x.id === id; });
  if (!s) return;
  const c = document.createElement("canvas");
  desenharArte(s, c).then(function(){
    c.toBlob(function(blob){
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "story-" + id + ".png";
      document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
      toast("Arte baixada! 🎨");
    }, "image/png");
  });
}

          </div>
          <div class="campo"><label>Nome do produto</label>
            <input id="p${n}-nome" value="${esc(p.nome || "")}" placeholder="Ex.: Air Fryer Mondial 4L"></div>
          <div class="duas-colunas">
            <div class="campo"><label>Preço</label>
              <input id="p${n}-preco" value="${esc(p.preco || "")}" placeholder="Ex.: 299,90"></div>
            <div class="campo"><label>Parcelamento (opcional)</label>
              <input id="p${n}-parcelas" value="${esc(p.parcelas || "")}" placeholder="Ex.: ou 10x de R$ 29,99"></div>
          </div>
          <div class="duas-colunas">
            <div class="campo"><label>Cupom (opcional)</label>
              <input id="p${n}-cupom" value="${esc(p.cupom || "")}" placeholder="Ex.: LIVE"></div>
            <div class="campo"><label>Link do produto</label>
              <input id="p${n}-link" value="${esc(p.link || "")}" placeholder="https://..."></div>
          </div>
        </div>
      </div>`;
  }

  const arteAberta = arteAbertaId ? stories.find(function(x){ return x.id === arteAbertaId; }) : null;

  const listaHtml = stories.slice(0, 40).map(function(s){
    const n1 = (s.produtos && s.produtos[0] && s.produtos[0].nome) || "(sem nome)";
    const n2 = (s.produtos && s.produtos[1] && s.produtos[1].nome) || "";
    const mini = (s.produtos && s.produtos[0] && s.produtos[0].img) || "";
    return `
      <div class="linha-story">
        ${mini ? `<img class="mini" src="${esc(mini)}">` : `<div class="mini" style="display:flex;align-items:center;justify-content:center">🛍️</div>`}
        <div class="titulo">${esc(n1)}${n2 ? " + " + esc(n2) : ""}</div>
        <button class="btn-icone" title="Ver arte" onclick="abrirArte('${esc(s.id)}')">🎨</button>
        <button class="btn-icone" title="Copiar link" onclick="copiar(linkDaPagina('${esc(s.id)}'), 'Link copiado! 🔗')">🔗</button>
        <button class="btn-icone" title="Editar" onclick="editarStory('${esc(s.id)}')">✏️</button>
        <button class="btn-icone perigo" title="Apagar" onclick="apagarStory('${esc(s.id)}')">🗑️</button>
      </div>`;
  }).join("");

  app.innerHTML = `
    <div class="container">
      <div class="janela">
        <div class="barra barra-lilas"><span>👑🤴 Painel do Story Duplo</span>${controles()}</div>
        <div class="corpo" style="text-align:center;padding:16px">
          <div style="font-size:14px;font-weight:600">Oi, ${esc((usuario.displayName || usuario.email).split(" ")[0])}! ${editandoId ? "Editando um duo. ✏️" : "Cadastra os 2 achadinhos 👇"}</div>
          <div style="margin-top:10px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
            <a class="btn btn-mini" href="#/">👀 Ver o site</a>
            <button class="btn btn-mini" onclick="sairGoogle()">Sair</button>
            ${editandoId ? `<button class="btn btn-mini btn-rosa" onclick="cancelarEdicao()">Cancelar edição</button>` : ""}
          </div>
        </div>
      </div>

      ${arteAberta ? `
      <div class="painel-secao">
        <div class="barra barra-amarela"><span>🎨 Arte do story</span>${controles()}</div>
        <div class="conteudo arte-wrap">
          <canvas id="canvas-arte"></canvas>
          <div class="link-caixa">
            <span class="url">${esc(linkDaPagina(arteAberta.id))}</span>
            <button class="btn btn-verde btn-mini" onclick="copiar(linkDaPagina('${esc(arteAberta.id)}'), 'Link copiado! 🔗')">Copiar</button>
          </div>
          <button class="btn btn-amarelo btn-bloco" onclick="baixarArte('${esc(arteAberta.id)}')">⬇️ Baixar arte do story (PNG)</button>
          <button class="btn btn-mini" style="margin-top:10px" onclick="fecharArte()">Fechar</button>
        </div>
      </div>` : ""}

      ${blocoProduto(1, p1)}
      ${blocoProduto(2, p2)}

      <div class="painel-secao">
        <div class="conteudo">
          <button class="btn btn-amarelo btn-bloco" onclick="salvarStory()">${editandoId ? "💾 Salvar alterações e gerar arte" : "🚀 Criar duo e gerar arte"}</button>
        </div>
      </div>

      <div class="painel-secao">
        <div class="barra barra-rosa"><span>📚 Duos já criados</span>${controles()}</div>
        <div class="conteudo">
          ${listaHtml || `<div class="vazio"><div class="emoji">📦</div>Nenhum duo ainda — cria o primeiro!</div>`}
        </div>
      </div>
    </div>`;

  if (arteAberta){
    const cv = document.getElementById("canvas-arte");
    if (cv) desenharArte(arteAberta, cv);
  }
}

function fotoEscolhida(n, input){
  const f = input.files && input.files[0];
  if (!f) return;
  toast("Ajeitando a foto… 📷");
  comprimirFoto(f, function(dataURL){
    fotosTmp[n] = dataURL;
    rota();
  });
}

function lerProduto(n, anterior){
  return {
    nome: document.getElementById("p" + n + "-nome").value.trim(),
    preco: document.getElementById("p" + n + "-preco").value.trim(),
    parcelas: document.getElementById("p" + n + "-parcelas").value.trim(),
    cupom: document.getElementById("p" + n + "-cupom").value.trim(),
    link: document.getElementById("p" + n + "-link").value.trim(),
    img: fotosTmp[n] || (anterior && anterior.img) || ""
  };
}

function salvarStory(){
  const emEdicao = editandoId ? stories.find(function(x){ return x.id === editandoId; }) : null;
  const a1 = (emEdicao && emEdicao.produtos && emEdicao.produtos[0]) || null;
  const a2 = (emEdicao && emEdicao.produtos && emEdicao.produtos[1]) || null;
  const prod1 = lerProduto(1, a1), prod2 = lerProduto(2, a2);
  if (!prod1.nome && !prod2.nome){ toast("Preenche pelo menos um produto!"); return; }
  const produtos = [prod1, prod2].filter(function(p){ return p.nome || p.img; });
  const id = editandoId || novoSlug();
  const dados = {
    produtos: produtos,
    criadaEm: emEdicao ? (emEdicao.criadaEm || Date.now()) : Date.now(),
    atualizadaEm: Date.now()
  };
  COL.doc(id).set(dados).then(function(){
    toast(editandoId ? "Duo atualizado! ✅" : "Duo criado! 🚀");
    editandoId = null;
    fotosTmp = { 1: "", 2: "" };
    arteAbertaId = id;
    /* onSnapshot re-renderiza */
  }).catch(function(e){ toast("Erro ao salvar: " + (e && e.message || e)); });
}

function editarStory(id){
  editandoId = id;
  fotosTmp = { 1: "", 2: "" };
  arteAbertaId = null;
  rota();
  window.scrollTo({ top: 0, behavior: "smooth" });
}
function cancelarEdicao(){
  editandoId = null;
  fotosTmp = { 1: "", 2: "" };
  rota();
}
function apagarStory(id){
  if (!confirm("Apagar esse duo? O link dele para de funcionar.")) return;
  COL.doc(id).delete().then(function(){
    if (arteAbertaId === id) arteAbertaId = null;
    if (editandoId === id) editandoId = null;
    toast("Apagado! 🗑️");
  }).catch(function(e){ toast("Erro: " + (e && e.message || e)); });
}
function abrirArte(id){
  arteAbertaId = id;
  rota();
  window.scrollTo({ top: 0, behavior: "smooth" });
}
function fecharArte(){
  arteAbertaId = null;
  rota();
}

/* impedir que cliques em âncoras internas virem navegação estranha em preview */
document.addEventListener("click", function(ev){
  const a = ev.target.closest && ev.target.closest('a[href^="#"]');
  if (a){ ev.preventDefault(); location.hash = a.getAttribute("href"); }
});

rota();
</script>
</body>
</html>
