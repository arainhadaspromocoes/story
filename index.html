<body>
<div id="app"></div>
<div id="toast" class="toast"></div>

<script>
/* ================================================================
   STORY DUPLO — Achadinhos em Dupla (Rainha 👑 + Imperador 🤴)
   - Página pública:  #/s/{slug}   - Painel:  #/admin   - Lista: #/
   Dados: coleção "stories" no Firestore (projeto lives-da-rainha)
   ================================================================ */

const ADMIN_EMAILS = ["vpthais@gmail.com", "jeanligeiro4@hotmail.com"];
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyA6qO04sAW0nPFKg_z40CRXGAC0x4E70dE",
  authDomain: "lives-da-rainha.firebaseapp.com",
  projectId: "lives-da-rainha",
  storageBucket: "lives-da-rainha.firebasestorage.app",
  messagingSenderId: "85874306516",
  appId: "1:85874306516:web:91c45fcfcb65ed602cba41"
};
firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.firestore();
try { db.settings({ experimentalAutoDetectLongPolling: true, merge: true }); } catch(e){}
const auth = firebase.auth();
const COL = db.collection("stories");

/* ---------- DADOS (tempo real + reservas) ---------- */
let stories = null;           // [{id, ...dados}]
let configSite = {};          // doc _config (ex.: link do grupo do WhatsApp)
let tempoRealOk = false;
const CHAVE_CACHE = "stories_cache_v2";
function separarConfig(arr){
  configSite = arr.find(function(x){ return x.id === "_config"; }) || configSite || {};
  return arr.filter(function(x){ return x.id.charAt(0) !== "_"; });
}
function zapLink(){
  return String(configSite.whatsapp || "https://chat.whatsapp.com/I6zDcwnyncMFooEi5vsbw3").trim();
}
function guardarCache(){ try { localStorage.setItem(CHAVE_CACHE, JSON.stringify({ s: stories, c: configSite })); } catch(e){} }
try {
  const c = JSON.parse(localStorage.getItem(CHAVE_CACHE) || "null");
  if (c && Array.isArray(c.s)){ stories = c.s; configSite = c.c || {}; }
} catch(e){}

COL.onSnapshot(function(snap){
  tempoRealOk = true;
  const arr = [];
  snap.forEach(function(d){ arr.push(Object.assign({ id: d.id }, d.data())); });
  stories = separarConfig(arr);
  stories.sort(function(a,b){ return (b.criadaEm||0) - (a.criadaEm||0); });
  guardarCache();
  rota();
}, function(err){
  console.error(err);
  if (stories === null) carregarViaRest();
});

function valorRest(v){
  if (!v) return null;
  if ("stringValue" in v) return v.stringValue;
  if ("booleanValue" in v) return v.booleanValue;
  if ("integerValue" in v) return Number(v.integerValue);
  if ("doubleValue" in v) return v.doubleValue;
  if ("nullValue" in v) return null;
  if ("arrayValue" in v) return (v.arrayValue.values || []).map(valorRest);
  if ("mapValue" in v) { const o = {}, f = v.mapValue.fields || {}; for (const k in f) o[k] = valorRest(f[k]); return o; }
  return null;
}
let buscandoRest = false;
function carregarViaRest(){
  if (buscandoRest || tempoRealOk) return;
  buscandoRest = true;
  fetch("https://firestore.googleapis.com/v1/projects/" + FIREBASE_CONFIG.projectId +
        "/databases/(default)/documents/stories?pageSize=300&key=" + FIREBASE_CONFIG.apiKey)
    .then(r => r.json())
    .then(function(j){
      buscandoRest = false;
      if (tempoRealOk) return;
      const arr = (j.documents || []).map(function(docu){
        const obj = {}, f = docu.fields || {};
        for (const k in f) obj[k] = valorRest(f[k]);
        obj.id = docu.name.split("/").pop();
        return obj;
      });
      stories = separarConfig(arr);
      stories.sort(function(a,b){ return (b.criadaEm||0) - (a.criadaEm||0); });
      guardarCache();
      rota();
    })
    .catch(function(){ buscandoRest = false; });
}
setTimeout(function(){ if (!tempoRealOk) carregarViaRest(); }, 5000);
setInterval(function(){ if (!tempoRealOk && stories === null) carregarViaRest(); }, 12000);

/* ---------- AUTENTICAÇÃO ---------- */
let usuario = null;
let authPronto = false;
auth.onAuthStateChanged(function(u){ usuario = u; authPronto = true; rota(); });
function entrarGoogle(){
  auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(function(e){
    if (e && (e.code === "auth/popup-blocked" || e.code === "auth/cancelled-popup-request"))
      auth.signInWithRedirect(new firebase.auth.GoogleAuthProvider());
    else toast("Não deu pra entrar: " + (e && e.message || e));
  });
}
function sairGoogle(){ auth.signOut(); }

/* ---------- UTILITÁRIOS ---------- */
function esc(t){
  return String(t == null ? "" : t)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("mostra");
  clearTimeout(el._t);
  el._t = setTimeout(function(){ el.classList.remove("mostra"); }, 2400);
}
function copiar(texto, msg){
  const fim = function(){ toast(msg || "Copiado! ✅"); };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(texto).then(fim, function(){ copiarVelho(texto); fim(); });
  else { copiarVelho(texto); fim(); }
}
function copiarVelho(texto){
  const ta = document.createElement("textarea");
  ta.value = texto; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); } catch(e){}
  document.body.removeChild(ta);
}
function abrirPromo(id, i){
  const st = (stories || []).find(function(x){ return x.id === id; });
  const p = st && st.produtos && st.produtos[i];
  if (!p) return;
  const cupom = String(p.cupom || "").trim();
  if (cupom) copiarEAbrir(cupom.toUpperCase(), p.link || "");
  else if (p.link) window.open(p.link, "_blank", "noopener");
}

function copiarEAbrir(codigo, url){
  copiar(codigo, "Cupom " + codigo + " copiado! Abrindo a loja… 🛍️");
  if (url) setTimeout(function(){ window.open(url, "_blank", "noopener"); }, 350);
}
function controles(){
  return '<span class="controles"><span>○</span><span>—</span><span>✕</span></span>';
}
function novoSlug(){
  return Date.now().toString(36) + Math.random().toString(36).slice(2,6);
}
function linkDaPagina(id){
  return location.origin + location.pathname + "#/s/" + id;
}
function precoBonito(p){
  p = String(p || "").trim();
  if (!p) return "";
  return p.match(/^R\$/i) ? p : "R$ " + p;
}

/* Comprimir foto para dataURL (produto: fundo geralmente branco → JPEG) */
function comprimirFoto(file, cb){
  const leitor = new FileReader();
  leitor.onload = function(){
    const img = new Image();
    img.onload = function(){
      const MAX = 500;
      let w = img.width, h = img.height;
      const fator = Math.min(1, MAX / Math.max(w, h));
      w = Math.round(w * fator); h = Math.round(h * fator);
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      cb(c.toDataURL("image/jpeg", 0.82));
    };
    img.src = leitor.result;
  };
  leitor.readAsDataURL(file);
}

/* ================= ARTE DO STORY (desenhada no estilo dos mini sites) ================= */
const ARTE_W = 1080, ARTE_H = 1920;
const COR = {
  azul: "#3A4BD8", tinta: "#15151F", papel: "#F2F1EA",
  amarelo: "#F5C518", lilas: "#A99DF5", verde: "#5FD68F",
  rosa: "#F2557C", rosaClaro: "#FFD3DE", branco: "#FFFFFF"
};

function quebrarLinhas(ctx, texto, maxLargura, maxLinhas){
  const palavras = String(texto || "").split(/\s+/).filter(Boolean);
  const linhas = [];
  let atual = "";
  for (const p of palavras){
    const teste = atual ? atual + " " + p : p;
    if (ctx.measureText(teste).width <= maxLargura) atual = teste;
    else {
      if (atual) linhas.push(atual);
      atual = p;
      if (linhas.length === maxLinhas - 1) break;
    }
  }
  if (atual && linhas.length < maxLinhas) linhas.push(atual);
  if (linhas.length === maxLinhas){
    const resto = palavras.join(" ");
    let usado = linhas.join(" ");
    if (resto.length > usado.length){
      let ult = linhas[maxLinhas-1];
      while (ctx.measureText(ult + "…").width > maxLargura && ult.length > 2) ult = ult.slice(0, -1);
      linhas[maxLinhas-1] = ult + "…";
    }
  }
  return linhas;
}

function carregarImg(src){
  return new Promise(function(res){
    if (!src) return res(null);
    const im = new Image();
    im.onload = function(){ res(im); };
    im.onerror = function(){ res(null); };
    im.src = src;
  });
}

function rRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/* janela estilo retrô: sombra dura + corpo papel + barra colorida com ○ — ✕ */
function desenharJanela(ctx, x, y, w, h, corBarra, titulo, alturaBarra, rotuloDireita){
  const AB = alturaBarra || 62;
  ctx.save();
  ctx.fillStyle = COR.tinta;
  rRect(ctx, x + 12, y + 12, w, h, 20); ctx.fill();
  ctx.fillStyle = COR.papel;
  rRect(ctx, x, y, w, h, 20); ctx.fill();
  ctx.save();
  rRect(ctx, x, y, w, h, 20); ctx.clip();
  ctx.fillStyle = corBarra;
  ctx.fillRect(x, y, w, AB);
  ctx.restore();
  ctx.beginPath();
  ctx.moveTo(x, y + AB); ctx.lineTo(x + w, y + AB);
  ctx.strokeStyle = COR.tinta; ctx.lineWidth = 6; ctx.stroke();
  rRect(ctx, x, y, w, h, 20); ctx.stroke();
  ctx.fillStyle = COR.tinta;
  ctx.textBaseline = "middle";
  ctx.font = '700 30px "Space Grotesk"';
  ctx.fillText(String(titulo || ""), x + 26, y + AB/2 + 2);
  if (rotuloDireita){
    ctx.font = '600 23px "Space Grotesk"';
    ctx.textAlign = "right";
    ctx.globalAlpha = .55;
    ctx.fillText(rotuloDireita, x + w - 24, y + AB/2 + 2);
    ctx.globalAlpha = 1;
    ctx.textAlign = "left";
  }
  ctx.restore();
  return { cx: x, cy: y + AB, cw: w, ch: h - AB };
}

function desenharFundo(ctx){
  ctx.fillStyle = COR.azul;
  ctx.fillRect(0, 0, ARTE_W, ARTE_H);
  ctx.strokeStyle = "rgba(255,255,255,.09)";
  ctx.lineWidth = 2;
  for (let gx = 0; gx <= ARTE_W; gx += 54){
    ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, ARTE_H); ctx.stroke();
  }
  for (let gy = 0; gy <= ARTE_H; gy += 54){
    ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(ARTE_W, gy); ctx.stroke();
  }
}

function desenharInsta(ctx, x, y, s, cor){
  /* símbolo do Instagram: quadrado arredondado + lente + pontinho */
  const tom = cor || COR.tinta;
  ctx.save();
  ctx.strokeStyle = tom; ctx.lineWidth = Math.max(2.5, s * .09); ctx.lineCap = "round";
  rRect(ctx, x, y, s, s, s * .3); ctx.stroke();
  ctx.beginPath();
  ctx.arc(x + s/2, y + s/2, s * .22, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath();
  ctx.arc(x + s * .74, y + s * .26, s * .06, 0, Math.PI * 2);
  ctx.fillStyle = tom; ctx.fill();
  ctx.restore();
}

function gradInsta(ctx, x, y, s){
  /* degradê oficial do Instagram */
  const g = ctx.createLinearGradient(x, y + s, x + s, y);
  g.addColorStop(0, "#FEDA75");
  g.addColorStop(.3, "#FA7E1E");
  g.addColorStop(.55, "#D62976");
  g.addColorStop(.8, "#962FBF");
  g.addColorStop(1, "#4F5BD5");
  return g;
}

function chipInsta(ctx, arroba, x, y, alturaChip, fonte){
  ctx.font = fonte;
  const icone = alturaChip * .55;
  const larg = ctx.measureText(arroba).width + icone + 14;
  desenharInsta(ctx, x, y + (alturaChip - icone)/2, icone);
  ctx.fillStyle = COR.tinta;
  ctx.textBaseline = "middle";
  ctx.font = fonte;
  ctx.fillText(arroba, x + icone + 14, y + alturaChip/2 + 2);
  return larg;
}

function medirChipInsta(ctx, arroba, alturaChip, fonte){
  ctx.font = fonte;
  return ctx.measureText(arroba).width + alturaChip * .55 + 14;
}

async function desenharArte(story, canvas){
  try { await document.fonts.load('700 76px "Space Grotesk"'); } catch(e){}
  try { await document.fonts.load('600 32px "Space Grotesk"'); } catch(e){}
  canvas.width = ARTE_W; canvas.height = ARTE_H;
  const ctx = canvas.getContext("2d");
  desenharFundo(ctx);

  /* ---- cabeçalho G2: cápsulas creme + medalhão da coroa + Instagram colorido ---- */
  const cy0 = 150, RMED = 88;
  function pillArroba(x0, x1, v0, v1, txt){
    const h = 74, py = cy0 - h/2;
    ctx.save(); ctx.shadowColor = "rgba(0,0,0,.35)"; ctx.shadowOffsetX = 6; ctx.shadowOffsetY = 6;
    rRect(ctx, x0, py, x1 - x0, h, 37); ctx.fillStyle = COR.papel; ctx.fill(); ctx.restore();
    rRect(ctx, x0, py, x1 - x0, h, 37); ctx.strokeStyle = COR.tinta; ctx.lineWidth = 5; ctx.stroke();
    const ic = 32;
    let f = 26;
    ctx.font = '700 ' + f + 'px "Space Grotesk"';
    const zona = (v1 - v0) - 36;
    while (ic + 13 + ctx.measureText(txt).width > zona && f > 18){
      f -= 1; ctx.font = '700 ' + f + 'px "Space Grotesk"';
    }
    const cw = ic + 13 + ctx.measureText(txt).width;
    const x = (v0 + v1)/2 - cw/2;
    desenharInsta(ctx, x, cy0 - ic/2, ic, gradInsta(ctx, x, cy0 - ic/2, ic));
    ctx.fillStyle = COR.tinta;
    ctx.textBaseline = "middle";
    ctx.fillText(txt, x + ic + 13, cy0 + 2);
  }
  pillArroba(60, 560, 60, ARTE_W/2 - RMED - 8, "@arainhadaspromocoes");
  pillArroba(520, 1020, ARTE_W/2 + RMED + 8, 1020, "@imperadordaspromocoes");
  /* medalhão central com a coroa */
  ctx.save(); ctx.shadowColor = "rgba(0,0,0,.5)"; ctx.shadowOffsetX = 6; ctx.shadowOffsetY = 6;
  ctx.beginPath(); ctx.arc(ARTE_W/2, cy0, RMED, 0, Math.PI*2); ctx.fillStyle = COR.tinta; ctx.fill(); ctx.restore();
  ctx.beginPath(); ctx.arc(ARTE_W/2, cy0, RMED, 0, Math.PI*2); ctx.strokeStyle = COR.amarelo; ctx.lineWidth = 8; ctx.stroke();
  ctx.beginPath(); ctx.arc(ARTE_W/2, cy0, RMED - 15, 0, Math.PI*2); ctx.setLineDash([3, 8]); ctx.strokeStyle = COR.amarelo; ctx.lineWidth = 2.5; ctx.stroke(); ctx.setLineDash([]);
  ctx.save(); ctx.shadowColor = "rgba(0,0,0,.45)"; ctx.shadowOffsetX = 4; ctx.shadowOffsetY = 4;
  ctx.font = "80px serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText("👑", ARTE_W/2, cy0 - 3); ctx.restore();
  ctx.textAlign = "left";

  /* ---- produtos ---- */
  const prods = (story.produtos || []).slice(0, 2);
  const imgs = await Promise.all(prods.map(function(p){ return carregarImg(p.img); }));
  const topo = 256, altura = 610, folga = 36;
  prods.forEach(function(p, i){
    const y = prods.length === 1 ? topo + 200 : topo + i * (altura + folga);
    const jan = desenharJanela(ctx, 60, y, 960, altura,
      i % 2 ? COR.verde : COR.amarelo, "Promoção " + (i + 1), 56, "anúncio");
    desenharProduto(ctx, p, imgs[i], jan, i === 0);
  });

  /* ---- rodapé: espaço do link entre as setas + chamada sem cara de botão ---- */
  ctx.textBaseline = "middle";
  ctx.font = "84px serif";
  ctx.fillText("👉", 60, 1636);
  ctx.fillText("👈", ARTE_W - 152, 1636);
  const rodY = 1694, rodH = 108;
  ctx.font = '700 52px "Space Grotesk"';
  const rodT = "CLIQUE NO LINK ACIMA";
  const rodL = ctx.measureText(rodT).width + 120;
  const rodX = ARTE_W/2 - rodL/2;
  ctx.fillStyle = COR.tinta; rRect(ctx, rodX + 10, rodY + 10, rodL, rodH, 22); ctx.fill();
  ctx.fillStyle = COR.amarelo; rRect(ctx, rodX, rodY, rodL, rodH, 22); ctx.fill();
  ctx.strokeStyle = COR.tinta; ctx.lineWidth = 6; rRect(ctx, rodX, rodY, rodL, rodH, 22); ctx.stroke();
  ctx.fillStyle = COR.tinta;
  ctx.font = '700 52px "Space Grotesk"';
  ctx.fillText(rodT, rodX + 60, rodY + rodH/2 + 4);
}

function desenharProduto(ctx, p, img, jan, fotoDireita){
  const pad = 34;
  const temFoto = !!img;
  const fotoLado = 465;
  const fotoX = temFoto
    ? (fotoDireita ? jan.cx + jan.cw - pad - fotoLado - 6 : jan.cx + pad + 6)
    : 0;
  const fotoY = jan.cy + Math.floor((jan.ch - fotoLado) / 2) - 6;
  let txtX, txtLarg;
  if (!temFoto){
    txtX = jan.cx + pad + 10;
    txtLarg = (jan.cx + jan.cw - pad) - txtX - 10;
  } else if (fotoDireita){
    txtX = jan.cx + pad + 6;
    txtLarg = fotoX - 40 - txtX;
  } else {
    txtX = fotoX + fotoLado + 40;
    txtLarg = (jan.cx + jan.cw - pad) - txtX - 10;
  }

  if (temFoto){
    ctx.save();
    ctx.fillStyle = COR.tinta;
    rRect(ctx, fotoX + 9, fotoY + 9, fotoLado, fotoLado, 18); ctx.fill();
    ctx.fillStyle = COR.branco;
    rRect(ctx, fotoX, fotoY, fotoLado, fotoLado, 18); ctx.fill();
    ctx.strokeStyle = COR.tinta; ctx.lineWidth = 6;
    rRect(ctx, fotoX, fotoY, fotoLado, fotoLado, 18); ctx.stroke();
    ctx.clip();
    const m = 14;
    const fator = Math.min((fotoLado - m*2) / img.width, (fotoLado - m*2) / img.height);
    const w = img.width * fator, h = img.height * fator;
    ctx.drawImage(img, fotoX + (fotoLado - w)/2, fotoY + (fotoLado - h)/2, w, h);
    ctx.restore();
  }

  ctx.textBaseline = "alphabetic";
  ctx.font = '700 38px "Space Grotesk"';
  const linhasNome = quebrarLinhas(ctx, p.nome, txtLarg, 3);
  const altNome = linhasNome.length * 48;
  const temPreco = !!String(p.preco || "").trim();
  const temParc = !!String(p.parcelas || "").trim();
  const temCupom = !!String(p.cupom || "").trim();
  const temTam = !!String(p.tamanho || "").trim();
  let altBloco = altNome;
  if (temPreco) altBloco += 92;
  if (temParc) altBloco += 44;
  if (temTam) altBloco += 78;
  if (temCupom) altBloco += 84;
  let y = jan.cy + Math.max(24, Math.floor((jan.ch - altBloco) / 2)) + 36;

  ctx.fillStyle = COR.tinta;
  ctx.font = '700 38px "Space Grotesk"';
  linhasNome.forEach(function(l){ ctx.fillText(l, txtX, y); y += 48; });

  if (temPreco){
    y += 40;
    ctx.fillStyle = COR.azul;
    ctx.font = '700 76px "Space Grotesk"';
    let ptxt = precoBonito(p.preco);
    while (ctx.measureText(ptxt).width > txtLarg && parseInt(ctx.font) > 40){
      ctx.font = '700 ' + (parseInt(ctx.font) - 4) + 'px "Space Grotesk"';
    }
    ctx.fillText(ptxt, txtX, y);
    y += 8;
  }

  if (temParc){
    y += 34;
    ctx.fillStyle = "#4a4a55";
    ctx.font = '600 30px "Space Grotesk"';
    ctx.fillText(quebrarLinhas(ctx, p.parcelas, txtLarg, 1)[0] || "", txtX, y);
    y += 4;
  }

  if (temTam){
    y += 24;
    const textoT = "📏 Tamanho: " + String(p.tamanho);
    let fT = 28;
    ctx.font = '700 ' + fT + 'px "Space Grotesk"';
    while (ctx.measureText(textoT).width + 36 > txtLarg && fT > 17){
      fT -= 1;
      ctx.font = '700 ' + fT + 'px "Space Grotesk"';
    }
    const largT = Math.min(txtLarg, ctx.measureText(textoT).width + 36);
    const altT = Math.max(46, fT + 26);
    ctx.save();
    ctx.fillStyle = COR.lilas;
    rRect(ctx, txtX, y - 8, largT, altT, 14); ctx.fill();
    ctx.strokeStyle = COR.tinta; ctx.lineWidth = 4.5;
    rRect(ctx, txtX, y - 8, largT, altT, 14); ctx.stroke();
    ctx.restore();
    ctx.fillStyle = COR.tinta;
    ctx.textBaseline = "middle";
    ctx.fillText(textoT, txtX + 18, y - 8 + altT/2 + 2);
    ctx.textBaseline = "alphabetic";
    y += altT - 2;
  }

  if (temCupom){
    y += 26;
    const texto = "🎟️ Cupom: " + String(p.cupom).toUpperCase();
    let fC = 30;
    ctx.font = '700 ' + fC + 'px "Space Grotesk"';
    while (ctx.measureText(texto).width + 40 > txtLarg && fC > 17){
      fC -= 1;
      ctx.font = '700 ' + fC + 'px "Space Grotesk"';
    }
    const larg = Math.min(txtLarg, ctx.measureText(texto).width + 40);
    const alt = Math.max(50, fC + 28);
    ctx.save();
    ctx.fillStyle = COR.amarelo;
    rRect(ctx, txtX, y - 10, larg, alt, 14); ctx.fill();
    ctx.strokeStyle = COR.tinta; ctx.lineWidth = 4.5; ctx.setLineDash([12, 9]);
    rRect(ctx, txtX, y - 10, larg, alt, 14); ctx.stroke();
    ctx.restore();
    ctx.fillStyle = COR.tinta;
    ctx.textBaseline = "middle";
    ctx.fillText(texto, txtX + 20, y - 10 + alt/2 + 2);
    ctx.textBaseline = "alphabetic";
  }
}

function baixarArte(id){
  const s = (stories || []).find(function(x){ return x.id === id; });
  if (!s) return;
  const c = document.createElement("canvas");

}

/* ============ TEMPLATE DO DIVULGADOR INTELIGENTE (1080x1920) ============ */
async function desenharTemplateDivulgador(canvas){
  try { await document.fonts.load('700 26px "Open Sans"'); } catch(e){}
  try { await document.fonts.load('800 50px "Open Sans"'); } catch(e){}
  const TW = 1080, TH = 1920;
  canvas.width = TW; canvas.height = TH;
  const ctx = canvas.getContext("2d");

  /* fundo azul quadriculado */
  ctx.fillStyle = COR.azul; ctx.fillRect(0, 0, TW, TH);
  ctx.strokeStyle = "rgba(255,255,255,.09)"; ctx.lineWidth = 2;
  for (let gx = 0; gx <= TW; gx += 54){ ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, TH); ctx.stroke(); }
  for (let gy = 0; gy <= TH; gy += 54){ ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(TW, gy); ctx.stroke(); }

  /* cabeçalho G2 (Open Sans nos arrobas) */
  const cy0 = 128, RM = 84;
  function pillT(x0, x1, v0, v1, txt){
    const h = 72, py = cy0 - h/2;
    ctx.save(); ctx.shadowColor = "rgba(0,0,0,.35)"; ctx.shadowOffsetX = 6; ctx.shadowOffsetY = 6;
    rRect(ctx, x0, py, x1-x0, h, 36); ctx.fillStyle = COR.papel; ctx.fill(); ctx.restore();
    rRect(ctx, x0, py, x1-x0, h, 36); ctx.strokeStyle = COR.tinta; ctx.lineWidth = 5; ctx.stroke();
    const ic = 31;
    let f = 25;
    ctx.font = '700 ' + f + 'px "Open Sans"';
    const zona = (v1 - v0) - 34;
    while (ic + 12 + ctx.measureText(txt).width > zona && f > 17){ f--; ctx.font = '700 ' + f + 'px "Open Sans"'; }
    const cw = ic + 12 + ctx.measureText(txt).width;
    const x = (v0 + v1)/2 - cw/2;
    desenharInsta(ctx, x, cy0 - ic/2, ic, gradInsta(ctx, x, cy0 - ic/2, ic));
    ctx.fillStyle = COR.tinta; ctx.textBaseline = "middle";
    ctx.fillText(txt, x + ic + 12, cy0 + 2);
  }
  pillT(56, 556, 56, TW/2 - RM - 8, "@arainhadaspromocoes");
  pillT(524, 1024, TW/2 + RM + 8, 1024, "@imperadordaspromocoes");
  ctx.save(); ctx.shadowColor = "rgba(0,0,0,.5)"; ctx.shadowOffsetX = 6; ctx.shadowOffsetY = 6;
  ctx.beginPath(); ctx.arc(TW/2, cy0, RM, 0, Math.PI*2); ctx.fillStyle = COR.tinta; ctx.fill(); ctx.restore();
  ctx.beginPath(); ctx.arc(TW/2, cy0, RM, 0, Math.PI*2); ctx.strokeStyle = COR.amarelo; ctx.lineWidth = 8; ctx.stroke();
  ctx.beginPath(); ctx.arc(TW/2, cy0, RM - 14, 0, Math.PI*2); ctx.setLineDash([3, 8]); ctx.strokeStyle = COR.amarelo; ctx.lineWidth = 2.5; ctx.stroke(); ctx.setLineDash([]);
  ctx.save(); ctx.shadowColor = "rgba(0,0,0,.45)"; ctx.shadowOffsetX = 4; ctx.shadowOffsetY = 4;
  ctx.font = "76px serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText("👑", TW/2, cy0 - 3); ctx.restore();
  ctx.textAlign = "left";

  /* janela branca onde o carimbo do programa entra */
  ctx.save(); ctx.shadowColor = "rgba(0,0,0,.45)"; ctx.shadowOffsetX = 12; ctx.shadowOffsetY = 12;
  rRect(ctx, 44, 300, 992, 1252, 22); ctx.fillStyle = "#FFFFFF"; ctx.fill(); ctx.restore();
  rRect(ctx, 44, 300, 992, 1252, 22); ctx.strokeStyle = COR.tinta; ctx.lineWidth = 6; ctx.stroke();

  /* #anúncio no cantinho inferior direito da janela */
  ctx.font = '700 30px "Open Sans"';
  ctx.fillStyle = COR.azul;
  ctx.textBaseline = "alphabetic"; ctx.textAlign = "right";
  ctx.fillText("#anúncio", 1000, 1512);
  ctx.textAlign = "left";

  /* mãozinhas centralizadas entre a janela e o botão */
  const stickY = 1628;
  ctx.textBaseline = "middle";
  ctx.font = "86px serif";
  ctx.fillText("👉", 60, stickY);
  ctx.fillText("👈", TW - 150, stickY);

  /* botão (Open Sans) */
  const rodY = 1692, rodH = 104;
  ctx.font = '800 50px "Open Sans"';
  const rodT = "CLIQUE NO LINK ACIMA";
  const rodL = ctx.measureText(rodT).width + 120;
  const rodX = TW/2 - rodL/2;
  ctx.fillStyle = COR.tinta; rRect(ctx, rodX + 10, rodY + 10, rodL, rodH, 22); ctx.fill();
  ctx.fillStyle = COR.amarelo; rRect(ctx, rodX, rodY, rodL, rodH, 22); ctx.fill();
  ctx.strokeStyle = COR.tinta; ctx.lineWidth = 6; rRect(ctx, rodX, rodY, rodL, rodH, 22); ctx.stroke();
  ctx.fillStyle = COR.tinta;
  ctx.font = '800 50px "Open Sans"';
  ctx.textAlign = "center";
  ctx.fillText(rodT, TW/2, rodY + rodH/2 + 4);
  ctx.textAlign = "left";
}

        ${itens || `<div class="vazio"><div class="emoji">📦</div>Ainda não tem promoções por aqui!</div>`}
      </div></div>
    </div>` + rodapePadrao();
}

/* ================= TELA: ADMIN ================= */
let fotosTmp = { 1: "", 2: "" };        // dataURLs das fotos do formulário
let editandoId = null;                   // id em edição (null = novo)
let arteAbertaId = null;                 // story mostrado na pré-visualização

function telaAdmin(app){
  if (!authPronto || stories === null){
    app.innerHTML = `<div class="container">
      <div class="janela"><div class="barra barra-amarela"><span>👑🤴 Painel</span>${controles()}</div>
      <div class="vazio"><div class="emoji">⏳</div>Carregando...</div></div></div>`;
    return;
  }
  if (!usuario){
    app.innerHTML = `
      <div class="senha-box">
        <div class="janela"><div class="barra barra-rosa"><span>🔐 Painel do Story Duplo</span>${controles()}</div>
        <div class="corpo" style="text-align:center;padding:26px 18px">
          <div class="cadeado">👑🤴</div>
          <p style="font-size:14px;margin-bottom:16px">Entra com a conta Google<br>pra montar as promoções.</p>
          <button class="btn btn-amarelo btn-bloco" onclick="entrarGoogle()">Entrar com Google</button>
          <p style="margin-top:14px"><a href="#/" style="font-size:13px;text-decoration:underline">← Voltar</a></p>
        </div></div>
      </div>`;
    return;
  }
  if (!ADMIN_EMAILS.includes(String(usuario.email || "").toLowerCase())){
    app.innerHTML = `
      <div class="senha-box">
        <div class="janela"><div class="barra barra-rosa"><span>🔐 Painel do Story Duplo</span>${controles()}</div>
        <div class="corpo" style="text-align:center;padding:26px 18px">
          <div class="cadeado">🚫</div>
          <p style="font-size:14px;margin-bottom:16px">Essa conta (${esc(usuario.email)}) não tem acesso.</p>
          <button class="btn btn-bloco" onclick="sairGoogle()">Sair e trocar de conta</button>
        </div></div>
      </div>`;
    return;
  }

  const emEdicao = editandoId ? stories.find(function(x){ return x.id === editandoId; }) : null;
  const p1 = (emEdicao && emEdicao.produtos && emEdicao.produtos[0]) || {};
  const p2 = (emEdicao && emEdicao.produtos && emEdicao.produtos[1]) || {};

  function blocoProduto(n, p){
    const foto = fotosTmp[n] || p.img || "";
    return `
      <div class="painel-secao">
        <div class="barra ${n === 1 ? "barra-amarela" : "barra-verde"}"><span>🛍️ Produto ${n}</span>${controles()}</div>
        <div class="conteudo">
          <div class="linha-foto">
            ${foto ? `<img class="foto-preview" src="${esc(foto)}">` : `<div class="foto-preview" style="display:flex;align-items:center;justify-content:center;font-size:26px">📷</div>`}
            <div style="flex:1">
              <label class="btn btn-mini" style="display:inline-flex">
                📁 Escolher foto
                <input type="file" accept="image/*" style="display:none" onchange="fotoEscolhida(${n}, this)">
              </label>
              <div style="font-size:11px;font-weight:600;opacity:.7;margin-top:6px">Print ou foto do produto (fundo branco fica melhor)</div>
            </div>
          </div>
          <div class="campo"><label>Nome do produto</label>
            <input id="p${n}-nome" value="${esc(p.nome || "")}" placeholder="Ex.: Air Fryer Mondial 4L"></div>
          <div class="duas-colunas">
            <div class="campo"><label>Preço</label>
              <input id="p${n}-preco" value="${esc(p.preco || "")}" placeholder="Ex.: 299,90"></div>
            <div class="campo"><label>Parcelamento (opcional)</label>
              <input id="p${n}-parcelas" value="${esc(p.parcelas || "")}" placeholder="Ex.: ou 10x de R$ 29,99"></div>
          </div>
          <div class="duas-colunas">
            <div class="campo"><label>Tamanho (opcional)</label>
              <input id="p${n}-tamanho" value="${esc(p.tamanho || "")}" placeholder="Ex.: só 43 · 39 ao 41 · P ao GG"></div>
            <div class="campo"><label>Cupom (opcional)</label>
              <input id="p${n}-cupom" value="${esc(p.cupom || "")}" placeholder="Ex.: LIVE"></div>
          </div>
          <div class="campo"><label>Link do produto</label>
            <input id="p${n}-link" value="${esc(p.link || "")}" placeholder="https://..."></div>
        </div>
      </div>`;
  }

  const arteAberta = arteAbertaId ? stories.find(function(x){ return x.id === arteAbertaId; }) : null;

  const listaHtml = stories.slice(0, 40).map(function(s){
    const n1 = (s.produtos && s.produtos[0] && s.produtos[0].nome) || "(sem nome)";
    const n2 = (s.produtos && s.produtos[1] && s.produtos[1].nome) || "";
    const mini = (s.produtos && s.produtos[0] && s.produtos[0].img) || "";
    return `
      <div class="linha-story">
        ${mini ? `<img class="mini" src="${esc(mini)}">` : `<div class="mini" style="display:flex;align-items:center;justify-content:center">🛍️</div>`}
        <div class="titulo">${esc(n1)}${n2 ? " + " + esc(n2) : ""}</div>
        <button class="btn-icone" title="Ver arte" onclick="abrirArte('${esc(s.id)}')">🎨</button>
        <button class="btn-icone" title="Copiar link" onclick="copiar(linkDaPagina('${esc(s.id)}'), 'Link copiado! 🔗')">🔗</button>
        <button class="btn-icone" title="Editar" onclick="editarStory('${esc(s.id)}')">✏️</button>
        <button class="btn-icone perigo" title="Apagar" onclick="apagarStory('${esc(s.id)}')">🗑️</button>
      </div>`;
  }).join("");

  app.innerHTML = `
    <div class="container">
      <div class="janela">
        <div class="barra barra-lilas"><span>👑🤴 Painel do Story Duplo</span>${controles()}</div>
        <div class="corpo" style="text-align:center;padding:16px">
          <div style="font-size:14px;font-weight:600">Oi, ${esc((usuario.displayName || usuario.email).split(" ")[0])}! ${editandoId ? "Editando um duo. ✏️" : "Cadastra as 2 promoções 👇"}</div>
          <div style="margin-top:10px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
            <a class="btn btn-mini" href="#/">👀 Ver o site</a>
            <button class="btn btn-mini" onclick="sairGoogle()">Sair</button>
            ${editandoId ? `<button class="btn btn-mini btn-rosa" onclick="cancelarEdicao()">Cancelar edição</button>` : ""}
          </div>
        </div>
      </div>

      ${arteAberta ? `
      <div class="painel-secao">
        <div class="barra barra-amarela"><span>🎨 Arte do story</span>${controles()}</div>
        <div class="conteudo arte-wrap">
          <canvas id="canvas-arte"></canvas>
          <div class="link-caixa">
            <span class="url">${esc(linkDaPagina(arteAberta.id))}</span>
            <button class="btn btn-verde btn-mini" onclick="copiar(linkDaPagina('${esc(arteAberta.id)}'), 'Link copiado! 🔗')">Copiar</button>
          </div>
          <button class="btn btn-amarelo btn-bloco" onclick="baixarArte('${esc(arteAberta.id)}')">⬇️ Baixar arte do story (PNG)</button>
          <button class="btn btn-mini" style="margin-top:10px" onclick="fecharArte()">Fechar</button>
        </div>
      </div>` : ""}

      ${blocoProduto(1, p1)}
      ${blocoProduto(2, p2)}

      <div class="painel-secao">
        <div class="conteudo">
          <button class="btn btn-amarelo btn-bloco" onclick="salvarStory()">${editandoId ? "💾 Salvar alterações e gerar arte" : "🚀 Criar duo e gerar arte"}</button>
        </div>
      </div>

      <div class="painel-secao">
        <div class="barra barra-lilas"><span>🖼️ Template do Divulgador</span>${controles()}</div>
        <div class="conteudo">
          <div style="font-size:13px;font-weight:600;margin-bottom:10px">Gera o template com a identidade da dupla pra importar no Divulgador Inteligente.</div>
          <button class="btn btn-mini btn-lilas" onclick="baixarTemplateDivulgador()">⬇️ Baixar template (PNG)</button>
        </div>
      </div>

      <div class="painel-secao">
        <div class="barra barra-verde"><span>💬 Grupo do WhatsApp</span>${controles()}</div>
        <div class="conteudo">
          <div class="campo"><label>Link do grupo (aparece nas páginas dos duos)</label>
            <input id="cfg-zap" value="${esc(configSite.whatsapp || "")}" placeholder="https://chat.whatsapp.com/..."></div>
          <button class="btn btn-mini btn-verde" onclick="salvarZap()">💾 Salvar link do grupo</button>
        </div>
      </div>

      <div class="painel-secao">
        <div class="barra barra-rosa"><span>📚 Duos já criados</span>${controles()}</div>
        <div class="conteudo">
          ${listaHtml || `<div class="vazio"><div class="emoji">📦</div>Nenhum duo ainda — cria o primeiro!</div>`}
        </div>
      </div>
    </div>`;

  if (arteAberta){
    const cv = document.getElementById("canvas-arte");
    if (cv) desenharArte(arteAberta, cv);
  }
}

function salvarZap(){
  const v = document.getElementById("cfg-zap").value.trim();
  COL.doc("_config").set({ whatsapp: v }, { merge: true }).then(function(){
    toast("Link do grupo salvo! 💬");
  }).catch(function(e){ toast("Erro: " + (e && e.message || e)); });
}

function fotoEscolhida(n, input){
  const f = input.files && input.files[0];
  if (!f) return;
  toast("Ajeitando a foto… 📷");
  comprimirFoto(f, function(dataURL){
    fotosTmp[n] = dataURL;
    rota();
  });
}

function lerProduto(n, anterior){
  return {
    nome: document.getElementById("p" + n + "-nome").value.trim(),
    preco: document.getElementById("p" + n + "-preco").value.trim(),
    parcelas: document.getElementById("p" + n + "-parcelas").value.trim(),
    tamanho: document.getElementById("p" + n + "-tamanho").value.trim(),
    cupom: document.getElementById("p" + n + "-cupom").value.trim(),
    link: document.getElementById("p" + n + "-link").value.trim(),
    img: fotosTmp[n] || (anterior && anterior.img) || ""
  };
}

function salvarStory(){
  const emEdicao = editandoId ? stories.find(function(x){ return x.id === editandoId; }) : null;
  const a1 = (emEdicao && emEdicao.produtos && emEdicao.produtos[0]) || null;
  const a2 = (emEdicao && emEdicao.produtos && emEdicao.produtos[1]) || null;
  const prod1 = lerProduto(1, a1), prod2 = lerProduto(2, a2);
  if (!prod1.nome && !prod2.nome){ toast("Preenche pelo menos um produto!"); return; }
  const produtos = [prod1, prod2].filter(function(p){ return p.nome || p.img; });
  const id = editandoId || novoSlug();
  const dados = {
    produtos: produtos,
    criadaEm: emEdicao ? (emEdicao.criadaEm || Date.now()) : Date.now(),
    atualizadaEm: Date.now()
  };
  COL.doc(id).set(dados).then(function(){
    toast(editandoId ? "Duo atualizado! ✅" : "Duo criado! 🚀");
    editandoId = null;
    fotosTmp = { 1: "", 2: "" };
    arteAbertaId = id;
    /* onSnapshot re-renderiza */
  }).catch(function(e){ toast("Erro ao salvar: " + (e && e.message || e)); });
}

function editarStory(id){
  editandoId = id;
  fotosTmp = { 1: "", 2: "" };
  arteAbertaId = null;
  rota();
  window.scrollTo({ top: 0, behavior: "smooth" });
}
function cancelarEdicao(){
  editandoId = null;
  fotosTmp = { 1: "", 2: "" };
  rota();
}
function apagarStory(id){
  if (!confirm("Apagar esse duo? O link dele para de funcionar.")) return;
  COL.doc(id).delete().then(function(){
    if (arteAbertaId === id) arteAbertaId = null;
    if (editandoId === id) editandoId = null;
    toast("Apagado! 🗑️");
  }).catch(function(e){ toast("Erro: " + (e && e.message || e)); });
}
function abrirArte(id){
  arteAbertaId = id;
  rota();
  window.scrollTo({ top: 0, behavior: "smooth" });
}
function fecharArte(){
  arteAbertaId = null;
  rota();
}

/* impedir que cliques em âncoras internas virem navegação estranha em preview */
document.addEventListener("click", function(ev){
  const a = ev.target.closest && ev.target.closest('a[href^="#"]');
  if (a){ ev.preventDefault(); location.hash = a.getAttribute("href"); }
});

rota();
</script>
